name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The control plane is a security boundary. A lockfile-resolved build,
      # lint and vulnerability scan are release requirements, not optional
      # local hygiene.
      - name: format
        run: cargo fmt --check
      - name: dependency vulnerabilities
        run: cargo install cargo-audit --locked && cargo audit
      - name: lint
        run: cargo clippy --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --locked
      - name: locked release build
        run: cargo build --release --locked
      - name: mTLS audit transport integration
        run: bash scripts/test-audit-mtls.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: glasir-control:ci
          platforms: linux/amd64
      - name: verify hardened runtime
        run: |
          test "$(docker image inspect glasir-control:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m glasir-control:ci --version
