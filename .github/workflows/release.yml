# A tagged control-plane build is an operational security artifact: publish a
# locked binary, its checksum and an SBOM from the exact same Cargo.lock.
name: release

on:
  push:
    tags: ["control-v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # musl, statically linked: a glibc build from the newest runner needs
          # that runner's glibc (2.39) and did not start on Ubuntu 22.04 or
          # RHEL 9. Measured with the Core, the same fix applies here.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          # Native, like the container images: ARM Linux is Graviton and
          # Ampere servers, and cross-compiled binaries would ship untested.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          # The last Intel image GitHub offers; it is retired in August 2027,
          # after which this entry has to cross-compile from Apple Silicon.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: security gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cargo install cargo-audit --locked
          cargo audit
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: package
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          BIN=target/${{ matrix.target }}/release/glasir-control
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          # Tags carry a prefix (`v`, `control-v`); the archive names the product
          # once and the platform the way a user would look for it.
          VERSION="${GITHUB_REF_NAME#control-}"
          VERSION="${VERSION#v}"
          NAME=glasir-control-$VERSION-${{ matrix.platform }}
          mkdir -p "dist/$NAME"
          cp "$BIN" LICENSE NOTICE README.md SECURITY.md "dist/$NAME/"
          # MIT, ISC, BSD and Unicode require their copyright and licence text
          # to travel with a binary; about.toml fails on any licence not listed.
          cargo about generate --locked --fail about.hbs -o "dist/$NAME/THIRD-PARTY-LICENSES.txt"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            ARCHIVE="$NAME.zip"
            7z a -tzip "$ARCHIVE" "$NAME" >/dev/null
          else
            ARCHIVE="$NAME.tar.gz"
            tar czf "$ARCHIVE" "$NAME"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            openssl dgst -sha256 -r "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  # Build each architecture on matching hardware. Building a Rust image for
  # ARM through QEMU is correct but unacceptably slow for a release pipeline.
  container-build:
    needs: [build]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glasir-control
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ matrix.suffix }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  # Publish one manifest only after both native images are present. Consumers
  # retain the familiar tag and Docker selects the matching architecture.
  container:
    needs: [container-build]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/glasir-control
          tags: |
            type=ref,event=tag
      - id: manifest
        name: publish multi-architecture manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/glasir-control
          REF: ${{ github.ref_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE="${IMAGE,,}"
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$tag" \
              "$IMAGE:$REF-amd64" "$IMAGE:$REF-arm64"
          done
          FIRST_TAG=$(printf '%s\n' "$TAGS" | head -n 1)
          DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/glasir-control
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: keyless sign image digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done

  publish:
    needs: [build, sbom, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # docker/build-push-action uploads an implementation-specific build
          # record as an artifact. It is not a release asset and cannot be
          # extracted by download-artifact on every runner.
          pattern: "!*.dockerbuild"
      - uses: softprops/action-gh-release@v2
        with:
          # A tag with a suffix (`v0.1.0-rc.6`) is a release candidate. Unmarked,
          # GitHub listed it as the latest release, which is what "download the
          # latest" and Scoop's update check resolve to.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*
          generate_release_notes: true
