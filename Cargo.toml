[package]
name = "glasir-control"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Policy, routing and audit boundary in front of Glasir Core"
repository = "https://github.com/Attackwave/glasir-control"
publish = false

[dependencies]
# jsonwebtoken 10 verifies nothing without a crypto backend: it panics at the
# first signature check. `rust_crypto` is pure Rust, like `ring` for TLS, so
# the build still needs no CMake. See .cargo/audit.toml for the one advisory
# it brings in.
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
pem = "3.0.6"
libc = "0.2.189"

[profile.release]
opt-level = 3
