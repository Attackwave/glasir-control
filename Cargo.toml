[package]
name = "glasir-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Policy, routing and audit boundary in front of Glasir Core"
repository = "https://github.com/Attackwave/glasir-control"
publish = false

[dependencies]
jsonwebtoken = "10.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
pem = "3.0.6"
libc = "0.2.189"

[profile.release]
opt-level = 3
