# Licences a dependency of a shipped binary may carry. A new one fails
# `cargo about generate` instead of being bundled unnoticed.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

# Only what is linked into the binary is shipped with it.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The project's own crates are covered by LICENSE and NOTICE.
private = { ignore = true }
